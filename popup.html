<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 340px; margin: 0; padding: 0;
    font: 13px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
    background: Canvas; color: CanvasText;
  }
  header { padding: 12px 14px 10px; border-bottom: 1px solid rgba(128,128,128,.25); }
  .host { font-weight: 600; font-size: 14px; }
  .sub { opacity: .6; font-size: 12px; margin-top: 2px; }
  .pad { padding: 12px 14px; }
  button.primary {
    width: 100%; font: inherit; font-weight: 600; cursor: pointer;
    background: #ff4757; color: #fff; border: 0;
    padding: 9px 12px; border-radius: 8px;
  }
  button.primary:hover { background: #e83e4d; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    opacity: .55; margin: 16px 14px 6px; font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 14px; border-top: 1px solid rgba(128,128,128,.14);
  }
  li:hover { background: rgba(128,128,128,.10); }
  li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .name.off { opacity: .45; text-decoration: line-through; }
  li .del {
    border: 0; background: transparent; cursor: pointer; color: inherit;
    opacity: .4; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 4px;
  }
  li .del:hover { opacity: 1; background: rgba(255,71,87,.2); }
  .row {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px; border-top: 1px solid rgba(128,128,128,.14);
  }
  .row label { flex: 1; }
  .empty { padding: 10px 14px; opacity: .55; font-size: 12px; }
  footer {
    padding: 10px 14px 12px; border-top: 1px solid rgba(128,128,128,.25);
    display: flex; gap: 8px; font-size: 12px;
  }
  footer button {
    font: inherit; cursor: pointer; background: rgba(128,128,128,.18);
    border: 0; color: inherit; padding: 5px 10px; border-radius: 6px;
  }
  footer button:hover { background: rgba(128,128,128,.32); }
  .hint { padding: 0 14px 12px; font-size: 11px; opacity: .5; }
  kbd {
    background: rgba(128,128,128,.25); border-radius: 3px;
    padding: 0 4px; font-family: inherit;
  }
</style>
</head>
<body>
  <header>
    <div class="host" id="host">—</div>
    <div class="sub" id="sub"></div>
  </header>

  <div class="pad">
    <button class="primary" id="pick">Скрыть элемент на странице</button>
  </div>
  <div class="hint">Или горячая клавиша <kbd>⌥⇧H</kbd> прямо на странице.</div>

  <div class="row">
    <label for="suspend">Временно показать всё на этом сайте</label>
    <input type="checkbox" id="suspend">
  </div>
  <div class="row">
    <label for="enabled">Расширение включено</label>
    <input type="checkbox" id="enabled">
  </div>

  <h2>Скрыто вручную</h2>
  <ul id="rules"></ul>
  <div class="empty" id="rules-empty" hidden>Пока ничего не скрыто.</div>

  <h2 id="presets-title" hidden>Готовые правила</h2>
  <ul id="presets"></ul>

  <footer>
    <button id="export">Экспорт</button>
    <button id="import">Импорт</button>
    <button id="reset">Сбросить сайт</button>
    <input type="file" id="file" accept="application/json" hidden>
  </footer>

  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
